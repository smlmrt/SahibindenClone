<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ücretsiz İlan Ver - SahibindenClone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css" />
    <style>
        .form-container {
            background: white;
            padding: 32px;
            max-width: 640px;
            margin: 24px auto;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
        }
        .form-container h2 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f2f5;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            font-family: inherit;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-submit {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            padding: 14px 20px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            transition: all .25s;
            box-shadow: 0 4px 14px rgba(37,99,235,0.25);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.35);
        }
        .btn-submit:active { transform: translateY(0); }
        #resultMessage {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }
        #resultMessage.success { display: block; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        #resultMessage.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .file-input-wrapper {
            position: relative;
            border: 2px dashed #e5e7eb;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
        }
        .file-input-wrapper:hover { border-color: #2563eb; background: #eff6ff; }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-input-wrapper .file-text { font-size: 14px; color: #6b7280; }
        .file-input-wrapper .file-text strong { color: #2563eb; }
        .file-preview { margin-top: 12px; }
        .file-preview img { max-width: 200px; max-height: 150px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">SahibindenClone</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item">Ana Sayfa</a>
            </nav>
        </div>
    </header>
    
    <div class="main-container" style="justify-content: center;">
        <div class="form-container">
            <h2>Ücretsiz İlan Ver</h2>
            <form id="postAdvertForm">
                <div class="form-group">
                    <label>İlan Başlığı</label>
                    <input type="text" id="title" class="form-control" required placeholder="Örn: Sahibinden Temiz Araç">
                </div>
                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea id="description" class="form-control" rows="4" required placeholder="İlanınızın detaylı açıklamasını yazın..."></textarea>
                </div>
                <div class="form-group">
                    <label>Fiyat (TL)</label>
                    <input type="number" id="price" class="form-control" required placeholder="0">
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="categoryId" class="form-control">
                        <option value="">Kategori yükleniyor...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Görsel Yükle</label>
                    <div class="file-input-wrapper" id="fileWrapper">
                        <input type="file" id="image" accept=".jpg,.jpeg,.png,.webp">
                        <div class="file-text">
                            <strong>Dosya seçmek için tıklayın</strong><br>
                            veya sürükleyip bırakın (JPG, PNG, max 5MB)
                        </div>
                    </div>
                    <div class="file-preview" id="filePreview"></div>
                </div>
                <button type="submit" class="btn-submit">İlanı Yayınla</button>
            </form>
            <div id="resultMessage"></div>
        </div>
    </div>

    <script src="js/auth-nav.js"></script>
    <script src="js/post-advert.js"></script>
</body>
</html>
