<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kayıt Ol - SahibindenClone</title>
    <link rel="stylesheet" href="css/site.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-container { max-width: 450px; margin: 50px auto; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #374151; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s; }
        .form-control:focus { border-color: #2563eb; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: transform .2s; }
        .btn-submit:hover { transform: translateY(-2px); }
        .text-center { text-align: center; margin-top: 20px; font-size: 14px; }
        .text-center a { color: #2563eb; text-decoration: none; font-weight: 600; }
        #resultMessage { margin-top: 16px; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; display: none; white-space: pre-line; }
        .success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; display: block !important; }
        .error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block !important; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">SahibindenClone</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item">Ana Sayfa</a>
                <a href="favorites.html" class="nav-item">Favorilerim</a>
            </nav>
        </div>
    </header>
    
    <div class="auth-container">
        <h2 style="margin-bottom: 24px; text-align: center; color: #111827;">Yeni Hesap Oluştur</h2>
        <form id="registerForm">
            <div style="display: flex; gap: 16px;">
                <div class="form-group" style="flex: 1;">
                    <label>Ad</label>
                    <input type="text" id="firstName" class="form-control" required minlength="2">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Soyad</label>
                    <input type="text" id="lastName" class="form-control" required minlength="2">
                </div>
            </div>
            
            <div class="form-group">
                <label>E-posta</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" class="form-control" required minlength="6" placeholder="En az 1 büyük harf ve 1 rakam">
            </div>
            
            <div class="form-group">
                <label>Şifre Tekrar</label>
                <input type="password" id="confirmPassword" class="form-control" required minlength="6">
            </div>
            
            <button type="submit" class="btn-submit">Kayıt Ol</button>
        </form>
        
        <div id="resultMessage"></div>
        
        <div class="text-center">
            Zaten hesabın var mı? <a href="login.html">Giriş Yap</a>
        </div>
    </div>

    <script src="js/auth-nav.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            const resultMessage = document.getElementById('resultMessage');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    resultMessage.className = 'success';
                    resultMessage.innerText = "Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...";
                    setTimeout(() => window.location.href = "login.html", 2000);
                } else {
                    const err = await response.json();
                    resultMessage.className = 'error';
                    
                    // Backend'den gelen birden fazla validasyon hatası varsa birleştirerek göster
                    if (err.errors) {
                        const errorMessages = Object.values(err.errors).flat().join('\n');
                        resultMessage.innerText = errorMessages;
                    } else {
                        resultMessage.innerText = err.message || "Kayıt işlemi başarısız oldu.";
                    }
                }
            } catch (error) {
                console.error("Hata:", error);
                resultMessage.className = 'error';
                resultMessage.innerText = "Sunucuya ulaşılamadı. Lütfen daha sonra tekrar deneyin.";
            }
        });
    </script>
</body>
</html>
