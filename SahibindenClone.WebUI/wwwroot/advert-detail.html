<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İlan Detayı - SahibindenClone</title>
    <link rel="stylesheet" href="css/site.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════ GENEL ═══════════════ */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
        }

        /* ═══════════════ BREADCRUMB ═══════════════ */
        .breadcrumb {
            max-width: 1100px;
            margin: 18px auto 0;
            padding: 0 16px;
            font-size: 13px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .breadcrumb a {
            color: #2563eb;
            text-decoration: none;
            transition: color .2s;
        }
        .breadcrumb a:hover { color: #1d4ed8; text-decoration: underline; }
        .breadcrumb .sep { color: #d1d5db; }
        .breadcrumb .current { color: #374151; font-weight: 500; }

        /* ═══════════════ DETAY WRAPPER ═══════════════ */
        .detail-wrapper {
            max-width: 1100px;
            margin: 16px auto 40px;
            padding: 0 16px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            align-items: start;
        }

        /* ═══════════════ SOL KOLON ═══════════════ */
        .detail-left {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Görsel Alanı --- */
        .image-showcase {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
            position: relative;
        }
        .image-showcase img {
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            display: block;
            background: #fafafa;
            transition: transform .4s cubic-bezier(.25,.46,.45,.94);
        }
        .image-showcase:hover img {
            transform: scale(1.02);
        }
        .no-image-placeholder {
            width: 100%;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #94a3b8;
        }
        .no-image-placeholder svg {
            width: 64px;
            height: 64px;
            opacity: .5;
        }

        /* --- Başlık + Fiyat Kartı --- */
        .title-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
        }
        .title-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .price-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            padding: 10px 22px;
            border-radius: 10px;
            letter-spacing: -.5px;
            box-shadow: 0 4px 14px rgba(37,99,235,.3);
            animation: priceIn .5s cubic-bezier(.34,1.56,.64,1) both;
        }
        @keyframes priceIn {
            from { opacity: 0; transform: translateY(8px) scale(.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .meta-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #6b7280;
            background: #f3f4f6;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .meta-chip svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* --- Açıklama Kartı --- */
        .description-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
        }
        .description-card h2 {
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .description-card h2::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #3b82f6, #1e40af);
            border-radius: 2px;
        }
        .description-text {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        /* ═══════════════ SAĞ KOLON ═══════════════ */
        .detail-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 20px;
        }

        /* --- İlan Sahibi Kartı --- */
        .seller-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
            text-align: center;
        }
        .seller-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 28px;
            font-weight: 700;
            color: #1e40af;
            box-shadow: 0 4px 12px rgba(37,99,235,.15);
            transition: transform .3s;
        }
        .seller-avatar:hover { transform: scale(1.08); }
        .seller-name {
            font-size: 17px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 6px;
        }
        .seller-since {
            font-size: 12px;
            color: #9ca3af;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
            box-shadow: 0 4px 14px rgba(5,150,105,.25);
        }
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5,150,105,.35);
        }
        .contact-btn:active { transform: translateY(0); }
        .contact-btn svg { width: 18px; height: 18px; }

        /* --- İlan Bilgileri Kartı --- */
        .info-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
        }
        .info-card h3 {
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-card h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #f59e0b, #d97706);
            border-radius: 2px;
        }
        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .info-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }
        .info-list li:last-child { border-bottom: none; }
        .info-label { color: #6b7280; }
        .info-value { color: #111827; font-weight: 500; }

        /* --- Geri Butonu --- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #2563eb;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #eff6ff;
            transition: all .2s;
        }
        .back-link:hover {
            background: #dbeafe;
            transform: translateX(-3px);
        }
        .back-link svg { width: 16px; height: 16px; }

        /* ═══════════════ LOADING ═══════════════ */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
            grid-column: 1 / -1;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 15px;
            color: #6b7280;
        }

        /* ═══════════════ HATA ═══════════════ */
        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 16px;
            grid-column: 1 / -1;
            text-align: center;
        }
        .error-state svg { width: 56px; height: 56px; color: #ef4444; }
        .error-state p { font-size: 16px; color: #6b7280; }

        /* ═══════════════ FADEİN ANİMASYONU ═══════════════ */
        .fade-up {
            animation: fadeUp .5s ease both;
        }
        .fade-up-delay-1 { animation-delay: .1s; }
        .fade-up-delay-2 { animation-delay: .2s; }
        .fade-up-delay-3 { animation-delay: .3s; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════ RESPONSİVE ═══════════════ */
        @media (max-width: 860px) {
            .detail-wrapper {
                grid-template-columns: 1fr;
            }
            .detail-right {
                position: static;
            }
        }
        @media (max-width: 480px) {
            .title-card { padding: 18px 16px; }
            .title-card h1 { font-size: 18px; }
            .price-badge { font-size: 22px; padding: 8px 16px; }
            .description-card { padding: 18px 16px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">SahibindenClone</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item">Ana Sayfa</a>
                <a href="favorites.html" class="nav-item">Favorilerim</a>
                <a href="post-advert.html" class="btn-post">Ücretsiz İlan Ver</a>
            </nav>
        </div>
    </header>

    <!-- Breadcrumb -->
    <nav class="breadcrumb" id="breadcrumb">
        <a href="index.html">Ana Sayfa</a>
        <span class="sep">›</span>
        <span class="current">İlan Detayı</span>
    </nav>

    <!-- İçerik -->
    <div class="detail-wrapper" id="detailContent">
        <div class="loading-state">
            <div class="spinner"></div>
            <span class="loading-text">İlan yükleniyor...</span>
        </div>
    </div>

    <script src="js/auth-nav.js"></script>
    <script src="js/advert-detail.js"></script>
</body>
</html>
