<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İlan Düzenle - SahibindenClone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css" />
    <style>
        .form-container {
            background: white;
            padding: 32px;
            max-width: 640px;
            margin: 24px auto;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
        }
        .form-container h2 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f2f5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-container h2 .badge {
            font-size: 12px;
            background: #eff6ff;
            color: #2563eb;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            font-family: inherit;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-row { display: flex; gap: 10px; }
        .btn-submit {
            flex: 1;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            padding: 14px 20px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            transition: all .25s;
            box-shadow: 0 4px 14px rgba(37,99,235,0.25);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.35);
        }
        .btn-cancel {
            padding: 14px 24px;
            background: #f3f4f6;
            color: #374151;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            text-decoration: none;
            text-align: center;
        }
        .btn-cancel:hover { background: #e5e7eb; }
        #resultMessage {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }
        #resultMessage.success { display: block; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
        #resultMessage.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .current-image {
            margin-top: 8px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            text-align: center;
        }
        .current-image img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            object-fit: cover;
        }
        .current-image p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }
        .loading-form {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        .loading-form .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">SahibindenClone</a>
            <nav class="nav-links">
                <a href="index.html" class="nav-item">Ana Sayfa</a>
                <a href="favorites.html" class="nav-item">Favorilerim</a>
            </nav>
        </div>
    </header>
    
    <div class="main-container" style="justify-content: center;">
        <div class="form-container" id="formContainer">
            <div class="loading-form">
                <div class="spinner"></div>
                <p>İlan bilgileri yükleniyor...</p>
            </div>
        </div>
    </div>

    <script src="js/auth-nav.js"></script>
    <script src="js/edit-advert.js"></script>
</body>
</html>
